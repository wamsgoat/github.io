<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan FX Zero Review — Wamsgoat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0d0d0d;
      --bg-surface: #1a1a1a;
      --line: #333333;
      --pink: #f4b8ca;
      --pink-dim: #a97e88;
      --text: #ededed;
      --muted: #969696;
      --font-display: 'Archivo Black', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(244, 184, 202, 0.05), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(150, 150, 150, 0.04), transparent 45%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--pink);
      color: var(--bg-deep);
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(18, 16, 14, 0.85);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--pink);
    }

    /* Header Dropdown Menu */
    .dropdown-wrap { position: relative; display: inline-block; }
    .nav-menu-btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 6px;
      background: rgba(26, 26, 26, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .nav-menu-btn .pink-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink);
      display: inline-block;
      box-shadow: 0 0 8px var(--pink);
      transition: transform 0.2s ease;
    }
    .nav-menu-btn:hover,
    .dropdown-wrap:hover .nav-menu-btn {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(244, 184, 202, 0.08);
      box-shadow: 0 0 16px rgba(244, 184, 202, 0.15);
      transform: translateY(-1px);
    }
    .dropdown-wrap:hover .nav-menu-btn .pink-dot {
      transform: scale(1.3);
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      padding-top: 6px;
      z-index: 50;
    }
    .dropdown-wrap:hover .dropdown-menu,
    .dropdown-menu:hover,
    .dropdown-menu.show { display: block; }
    .dropdown-inner {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-width: 220px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      overflow: hidden;
    }
    .dropdown-item {
      display: block;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text);
      border-bottom: 1px solid var(--line);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: rgba(244, 184, 202, 0.12); color: var(--pink); }

    /* Back Link & Review Header */
    .back-link {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--pink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 32px;
      margin-bottom: 16px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: var(--bg-deep);
      background: var(--muted);
      padding: 3px 8px;
      border-radius: 4px;
      margin-right: 6px;
      margin-bottom: 12px;
    }

    .tag.alt {
      background: var(--pink);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.18;
      letter-spacing: 0.02em;
      word-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .meta-box {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 20px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
    }

    .meta-box span b {
      color: var(--text);
    }

    /* Article Content */
    .review-content {
      font-size: 1.05rem;
      color: #d1d1d1;
      line-height: 1.7;
    }

    .review-content p {
      margin-bottom: 18px;
    }

    .review-image-wrap {
      margin-top: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .review-image-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      border: 1px solid var(--line);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      margin-top: 48px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .footer-inner a:hover {
      color: var(--pink);
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-inner">
      <a href="index.html" class="logo">WAMSGOAT</a>
      <nav>
        <div class="dropdown-wrap">
          <button class="nav-menu-btn" id="top-nav-btn"><span class="pink-dot"></span> MENU &#9662;</button>
          <div class="dropdown-menu">
            <div class="dropdown-inner">
              <a href="index.html" class="dropdown-item">Home &rarr;</a>
              <a href="mice.html" class="dropdown-item">Mice Reviews &rarr;</a>
              <a href="mousepads.html" class="dropdown-item">Mousepad Reviews &rarr;</a>
              <a href="accessories.html" class="dropdown-item">Accessories & Skates &rarr;</a>
              <a href="guides.html" class="dropdown-item">Guides &rarr;</a>
              <a href="about.html" class="dropdown-item">About &rarr;</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a href="mousepads.html" class="back-link">&larr; Back to Mousepad Reviews</a>

    <article>
      <div>
        <span class="tag">MOUSEPAD</span>
        <span class="tag alt">BALANCED</span>
      </div>

      <h1>Artisan FX Zero Review</h1>

      <div class="review-content">
        <p>Mousepad good and balanced</p>

        <div class="review-image-wrap">
          <a href="https://github.com/wamsgoat/Images/blob/6d7b25367833d358bc8c52f783a99b1fe9511086/zero.webp?raw=true" target="_blank" rel="noopener noreferrer">
            <img src="https://github.com/wamsgoat/Images/blob/6d7b25367833d358bc8c52f783a99b1fe9511086/zero.webp?raw=true" alt="Artisan FX Zero Mousepad">
          </a>
        </div>
      </div>
    </article>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 Wamsgoat.</span>
      <span><a href="index.html">Home</a> · <a href="mousepads.html">Mousepads</a></span>
    </div>
  </footer>

</body>

</html>
